[build]
  command = "npm run build:netlify"
  publish = "dist/client"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/mobile-preview"
  to = "/mobile-preview.html"
  status = 200
